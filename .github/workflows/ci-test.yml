on:
  push:
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'
name: Run Test Cases
jobs:
  test-on-mac:
    runs-on: macos-15-intel
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          ref: ${{ github.ref }}
      # - name: Setup Ruby 3.2
      #   uses: ruby/setup-ruby@v1
      #   with:
      #     ruby-version: '3.2'
      # - name: Setup Environment
      #   run: |
      #     gem install cocoapods --pre --no-document
      #     rm -rf $HOME/.cocoapods
      #     pod setup --silent
      #     pod install --silent --no-repo-update
      - name: Prepare iOS simulator
        run: |
          xcodebuild -version
          xcrun simctl list runtimes
          simulator_id=$(xcrun simctl create "QiniuSDK Tests" com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro com.apple.CoreSimulator.SimRuntime.iOS-18-5)
          xcrun simctl boot "$simulator_id"
          xcrun simctl bootstatus "$simulator_id" -b
          echo "QINIU_TEST_SIMULATOR_ID=$simulator_id" >> "$GITHUB_ENV"
      - name: setup-cocoapods
        uses: maxim-lobanov/setup-cocoapods@v1
        with:
          version: 1.14.2
      - name: Run Cases
        env:
          QINIU_TEST_ENV: travis
        run: |
          rm -rf $HOME/.cocoapods
          pod setup --silent
          pod install --silent --no-repo-update
          xcodebuild test -workspace QiniuSDK.xcworkspace -scheme QiniuSDK_iOS -configuration Debug -destination "platform=iOS Simulator,id=$QINIU_TEST_SIMULATOR_ID" -enableCodeCoverage YES
          xcodebuild test -workspace QiniuSDK.xcworkspace -scheme QiniuSDK_Mac -configuration Debug -destination 'platform=macOS,arch=x86_64'
          bash <(curl -s https://codecov.io/bash)
